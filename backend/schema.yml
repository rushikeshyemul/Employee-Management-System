        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - absent
          - holiday
          - late
          - leave
          - partial
          - present
        description: |-
          * `present` - Present
          * `late` - Late
          * `absent` - Absent
          * `partial` - Partial
          * `leave` - On Leave
          * `holiday` - Holiday
