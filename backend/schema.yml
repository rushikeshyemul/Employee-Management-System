openapi: 3.0.3
info:
  title: Workforce Hub / Employee Management System API
  version: 1.0.0
  description: Django REST Framework Backend providing HRMS capabilities for Workforce
    Hub.
paths:
  /api/v1/approvals/:
    get:
      operationId: v1_approvals_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - changes_requested
          - pending
          - rejected
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `rejected` - Rejected
          * `changes_requested` - Changes Requested
      - in: query
        name: type
        schema:
          type: string
          enum:
          - attendance_correction
          - hr_request
          - leave
          - profile_change
        description: |-
          * `leave` - Leave Request
          * `attendance_correction` - Attendance Correction
          * `hr_request` - HR Request
          * `profile_change` - Profile Change
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalList'
          description: ''
  /api/v1/approvals/{id}/:
    get:
      operationId: v1_approvals_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this approval.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
          description: ''
  /api/v1/approvals/{id}/decision/:
    post:
      operationId: v1_approvals_decision_create
      description: Record an approval decision (approve, reject, request_changes).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this approval.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
