          - pending
          - rejected
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `rejected` - Rejected
          * `changes_requested` - Changes Requested
      - in: query
        name: type
        schema:
          type: string
          enum:
          - attendance_correction
          - hr_request
          - leave
          - profile_change
        description: |-
          * `leave` - Leave Request
          * `attendance_correction` - Attendance Correction
          * `hr_request` - HR Request
          * `profile_change` - Profile Change
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
